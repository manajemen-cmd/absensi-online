<style>
:root {
  --bg: #f0f4ff;
  --white: #ffffff;
  --surface: #f8faff;
  --border: #dde5f5;
  --accent: #2563eb;
  --accent-light: #eff4ff;
  --accent2: #7c3aed;
  --green: #059669;
  --green-light: #ecfdf5;
  --red: #dc2626;
  --yellow: #d97706;
  --text: #0f172a;
  --muted: #64748b;
  --shadow: 0 4px 24px rgba(37,99,235,0.08);
  --shadow-lg: 0 8px 40px rgba(37,99,235,0.13);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* HEADER */
.header {
  background: var(--accent);
  color: white;
  padding: 0 20px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 2px 16px rgba(37,99,235,0.3);
}

.header-left { display: flex; align-items: center; gap: 10px; }
.header-logo { font-size: 22px; }
.header-title { font-size: 16px; font-weight: 700; }
.header-subtitle { font-size: 11px; opacity: 0.75; }

.cabang-badge {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.3);
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  backdrop-filter: blur(4px);
}

.clock-display {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  background: rgba(0,0,0,0.2);
  padding: 4px 10px;
  border-radius: 8px;
}

/* MAIN */
.main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }

/* CARD */
.card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.card-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--muted);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 6px;
}

/* SETUP CABANG SCREEN */
#screen-setup {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  background: var(--bg);
}

.setup-card {
  background: white;
  border-radius: 20px;
  padding: 32px 28px;
  width: 100%;
  max-width: 400px;
  box-shadow: var(--shadow-lg);
  text-align: center;
}

.setup-icon { font-size: 48px; margin-bottom: 12px; }
.setup-title { font-size: 22px; font-weight: 800; margin-bottom: 6px; color: var(--text); }
.setup-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

/* FORM */
.form-group { margin-bottom: 14px; text-align: left; }
label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }

input, select {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  background: var(--surface);
  outline: none;
  transition: all 0.2s;
}

input:focus, select:focus {
  border-color: var(--accent);
  background: white;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}

select option { background: white; }

/* BUTTONS */
.btn {
  padding: 13px 20px;
  border-radius: 12px;
  border: none;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
}

.btn-primary {
  background: var(--accent);
  color: white;
  box-shadow: 0 4px 14px rgba(37,99,235,0.35);
}
.btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }

.btn-success {
  background: var(--green);
  color: white;
  box-shadow: 0 4px 14px rgba(5,150,105,0.3);
}
.btn-success:hover { background: #047857; transform: translateY(-1px); }

.btn-outline {
  background: white;
  color: var(--accent);
  border: 1.5px solid var(--accent);
}

.btn-sm {
  padding: 8px 14px;
  font-size: 12px;
  width: auto;
  border-radius: 8px;
}

.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

/* KAMERA */
.camera-wrap {
  border-radius: 12px;
  overflow: hidden;
  border: 2px solid var(--border);
  background: #000;
  aspect-ratio: 4/3;
  position: relative;
}

#video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }

.cam-corners span {
  position: absolute;
  width: 18px; height: 18px;
  border-color: #00d4ff; border-style: solid; opacity: 0.8;
}
.cam-corners span:nth-child(1) { top:10px; left:10px; border-width:2px 0 0 2px; border-radius:3px 0 0 0; }
.cam-corners span:nth-child(2) { top:10px; right:10px; border-width:2px 2px 0 0; border-radius:0 3px 0 0; }
.cam-corners span:nth-child(3) { bottom:10px; left:10px; border-width:0 0 2px 2px; border-radius:0 0 0 3px; }
.cam-corners span:nth-child(4) { bottom:10px; right:10px; border-width:0 2px 2px 0; border-radius:0 0 3px 0; }

.cam-placeholder {
  aspect-ratio: 4/3;
  border: 2px dashed var(--border);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  color: var(--muted);
  transition: all 0.2s;
  background: var(--surface);
}
.cam-placeholder:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.cam-placeholder .icon { font-size: 36px; }

#photo-result { width: 100%; border-radius: 12px; border: 2px solid var(--green); display: none; }

.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.btn-row .btn { flex: 1; }

/* SUDAH ABSEN ALERT */
.alert {
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.alert-success { background: var(--green-light); color: var(--green); border: 1px solid #a7f3d0; }
.alert-info { background: var(--accent-light); color: var(--accent); border: 1px solid #bfdbfe; }
.alert-warning { background: #fffbeb; color: var(--yellow); border: 1px solid #fde68a; }

/* STATUS BADGE */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 700; text-transform: uppercase;
}
.badge-masuk { background: #d1fae5; color: var(--green); }
.badge-pulang { background: #fef3c7; color: var(--yellow); }

/* INFO ROW */
.info-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.info-row:last-child { border-bottom: none; }
.info-label { color: var(--muted); font-weight: 500; }
.info-val { font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 12px; }

/* TOAST */
.toast-wrap {
  position: fixed; top: 70px; right: 16px; z-index: 999;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: white; border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; font-weight: 600;
  box-shadow: var(--shadow-lg); max-width: 300px;
  animation: toastIn 0.3s ease;
  border-left: 3px solid var(--accent);
}
.toast.success { border-left-color: var(--green); }
.toast.error { border-left-color: var(--red); }

@keyframes toastIn {
  from { transform: translateX(80px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* LOADING */
.loading {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 20px; color: var(--muted); font-size: 14px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.divider { height: 1px; background: var(--border); margin: 16px 0; }

#screen-main { display: none; }
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast-wrap" id="toasts"></div>

<!-- ======================== SETUP SCREEN ======================== -->
<div id="screen-setup">
  <div class="setup-card">
    <div class="setup-icon">🏢</div>
    <div class="setup-title">Absensi Online</div>
    <div class="setup-sub">Pilih cabang dan masukkan ID karyawan Anda</div>

    <div class="form-group">
      <label>Pilih Cabang</label>
      <select id="cabang-select">
        <option value="">-- Memuat cabang... --</option>

    <div class="form-group">

<script>
// ============================================================
// STATE
// ============================================================
let currentUser = null;
let photoData = null;
let stream = null;
let todayStatus = { masuk: null, pulang: null };
let lokasiData = null; // {lat, lng, akurasi, alamat}

// ============================================================
// CLOCK
// ============================================================
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}
setInterval(updateClock, 1000);
updateClock();

// ============================================================
// FIREBASE HELPERS
// ============================================================
function waitFirebase() {
  return new Promise(resolve => {
    if (window._fbReady) return resolve();
    document.addEventListener('firebase-ready', resolve, { once: true });
  });
}

async function fbAdd(col, data) {
  return window._db.collection(col).add(data);
}

async function fbQuery(col, ...conditions) {
  let ref = window._db.collection(col);
  for (const cond of conditions) {
    ref = ref.where(cond.field, cond.op, cond.value);
  }
  const snap = await ref.get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function fbGetAll(col) {
  await waitFirebase();
  const snap = await window._db.collection(col).get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// ============================================================
// LOAD CABANG
// ============================================================
async function loadCabangList() {
  await waitFirebase();
  const list = await fbQuery('cabang');
  const sel = document.getElementById('cabang-select');
  if (!list.length) {
    sel.innerHTML = '<option value="">Belum ada cabang — hubungi HRD</option>';
    return;
  }
  sel.innerHTML = '<option value="">-- Pilih Cabang --</option>';
  list.forEach(c => {
    sel.innerHTML += `<option value="${c.id}">${c.nama}</option>`;
  });
}

// ============================================================
// LOGIN / CARI KARYAWAN
// ============================================================
async function loadKaryawan() {
  const cabangId = document.getElementById('cabang-select').value;
  const idInput = document.getElementById('id-karyawan').value.trim().toUpperCase();
  const result = document.getElementById('login-result');

  if (!cabangId) { showToast('Pilih cabang dulu!', 'error'); return; }
  if (!idInput) { showToast('Masukkan ID karyawan!', 'error'); return; }

  result.innerHTML = '<div class="loading"><div class="spinner"></div> Mencari...</div>';

  await waitFirebase();
  const list = await fbQuery('karyawan',
    {field:'cabangId', op:'==', value:cabangId},
    {field:'karyawanId', op:'==', value:idInput}
  );

  if (!list.length) {
    result.innerHTML = '<div class="alert alert-warning">⚠️ ID tidak ditemukan di cabang ini</div>';
    return;
  }

  const karyawan = list[0];
  const cabangList = await fbQuery('cabang');
  const cabang = cabangList.find(c => c.id === cabangId);

  currentUser = { ...karyawan, cabangNama: cabang?.nama || cabangId };
  result.innerHTML = '';

  document.getElementById('info-nama').textContent = karyawan.nama;
  document.getElementById('info-id').textContent = karyawan.karyawanId;
  document.getElementById('info-jabatan').textContent = karyawan.jabatan || '-';
  document.getElementById('info-cabang').textContent = currentUser.cabangNama;
  document.getElementById('header-cabang').textContent = 'Cabang ' + currentUser.cabangNama;

  document.getElementById('screen-setup').style.display = 'none';
  document.getElementById('screen-main').style.display = 'block';

  // Auto ambil lokasi saat login
  setTimeout(() => ambilLokasi(), 500);
  checkStatusHariIni();
}

function logout() {
  currentUser = null; photoData = null;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('screen-setup').style.display = 'flex';
  document.getElementById('screen-main').style.display = 'none';
  document.getElementById('cam-area').innerHTML = `
    <div class="cam-placeholder" onclick="startCam()">
      <div class="icon">📷</div>
      <div style="font-size:13px;font-weight:600">Tap untuk aktifkan kamera</div>
    </div>`;
  document.getElementById('photo-result').style.display = 'none';
  document.getElementById('cam-btns').style.display = 'none';
}

// ============================================================
// CEK STATUS HARI INI
// ============================================================
async function checkStatusHariIni() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('status-content').innerHTML =
    '<div class="loading"><div class="spinner"></div> Mengecek...</div>';

  const records = await fbQuery('absensi',
    {field:'karyawanId', op:'==', value:currentUser.karyawanId},
    {field:'cabangId', op:'==', value:currentUser.cabangId},
    {field:'tanggal', op:'==', value:today}
  );

  const masuk = records.find(r => r.status === 'Masuk');
  const pulang = records.find(r => r.status === 'Pulang');
  todayStatus = { masuk, pulang };

  let html = '';
  if (!masuk && !pulang) {
    html = '<div class="alert alert-info">📌 Belum absen hari ini</div>';
    document.getElementById('btn-masuk').style.display = 'flex';
    document.getElementById('btn-pulang').style.display = 'none';
  } else if (masuk && !pulang) {
    html = `<div class="alert alert-success">✅ Masuk: <strong>${masuk.waktu}</strong></div>
            <div class="alert alert-info" style="margin-top:6px">⏳ Belum absen pulang</div>`;
    document.getElementById('btn-masuk').style.display = 'none';
    document.getElementById('btn-pulang').style.display = 'flex';
  } else if (masuk && pulang) {
    html = `<div class="alert alert-success">✅ Masuk: <strong>${masuk.waktu}</strong></div>
            <div class="alert alert-success" style="margin-top:6px">🏠 Pulang: <strong>${pulang.waktu}</strong></div>`;
    document.getElementById('btn-masuk').style.display = 'none';
    document.getElementById('btn-pulang').style.display = 'none';
    document.getElementById('action-buttons').innerHTML =
      '<div class="alert alert-success">🎉 Absensi hari ini sudah lengkap!</div>';
  }

  document.getElementById('status-content').innerHTML = html;
}

// ============================================================
// KAMERA
// ============================================================
async function startCam() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    document.getElementById('cam-area').innerHTML = `
      <div class="camera-wrap">
        <video id="video" autoplay playsinline></video>
        <div class="cam-corners">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>`;
    document.getElementById('video').srcObject = stream;
    document.getElementById('cam-btns').style.display = 'flex';
    document.getElementById('btn-capture').style.display = 'flex';
    document.getElementById('btn-retake').style.display = 'none';
  } catch(e) {
    showToast('Tidak bisa akses kamera', 'error');
  }
}

function capturePhoto() {
  const video = document.getElementById('video');
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');

  // Gambar video (mirror)
  ctx.translate(canvas.width, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0); // reset transform

  // === WATERMARK TIMEMARK ===
  const now = new Date();
  const tgl = now.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
  const jam = now.toLocaleTimeString('id-ID', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const nama = currentUser?.nama || '';
  const cabang = currentUser?.cabangNama || '';
  const lokasi_txt = lokasiData?.alamat ? lokasiData.alamat.slice(0, 40) : '';

  const baris = [
    `${tgl}  ${jam}`,
    nama,
    cabang,
    lokasi_txt
  ].filter(Boolean);

  const W = canvas.width;
  const H = canvas.height;
  const fs = Math.max(14, Math.round(W * 0.033)); // font size responsif

  // Background strip bawah
  const stripH = (baris.length * (fs + 6)) + 16;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
  ctx.fillRect(0, H - stripH, W, stripH);

  // Teks putih
  ctx.font = `bold ${fs}px monospace`;
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 3;
  ctx.textBaseline = 'bottom';

  baris.forEach((line, i) => {
    const y = H - 8 - (baris.length - 1 - i) * (fs + 6);
    // Baris pertama (tanggal+jam) pakai warna kuning
    if (i === 0) {
      ctx.fillStyle = '#facc15';
      ctx.font = `bold ${fs}px monospace`;
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.font = `${fs - 1}px monospace`;
    }
    ctx.fillText(line, 10, y);
  });

  ctx.shadowBlur = 0;
  // === END WATERMARK ===

  photoData = canvas.toDataURL('image/jpeg', 0.85);

  document.getElementById('cam-area').innerHTML = '';
  const img = document.getElementById('photo-result');
  img.src = photoData; img.style.display = 'block';

  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('btn-capture').style.display = 'none';
  document.getElementById('btn-retake').style.display = 'flex';
  showToast('Foto berhasil diambil!', 'success');
}

function retake() {
  photoData = null;
  document.getElementById('photo-result').style.display = 'none';
  document.getElementById('cam-area').innerHTML = `
    <div class="cam-placeholder" onclick="startCam()">
      <div class="icon">📷</div>
      <div style="font-size:13px;font-weight:600">Tap untuk aktifkan kamera</div>
    </div>`;
  document.getElementById('cam-btns').style.display = 'none';
  startCam();
}

// ============================================================
// LOKASI GPS
// ============================================================
function ambilLokasi() {
  const el = document.getElementById('lokasi-status');
  if (!el) return;
  el.innerHTML = '<div class="loading"><div class="spinner"></div> Mengambil lokasi otomatis...</div>';

  if (!navigator.geolocation) {
    el.innerHTML = '<div class="alert" style="background:#fef3c7;color:#d97706;border:1px solid #fde68a">⚠️ GPS tidak didukung browser ini</div>';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude.toFixed(6);
      const lng = pos.coords.longitude.toFixed(6);
      const akurasi = Math.round(pos.coords.accuracy);
      lokasiData = { lat, lng, akurasi };

      // Reverse geocode pakai Nominatim (gratis)
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
        const data = await res.json();
        const alamat = data.display_name || `${lat}, ${lng}`;
        const parts = alamat.split(',');
        lokasiData.alamat = parts.slice(0,3).join(',').trim();
      } catch(e) {
        lokasiData.alamat = `${lat}, ${lng}`;
      }

      const akurasiColor = akurasi <= 50 ? '#059669' : akurasi <= 150 ? '#d97706' : '#dc2626';
      const akurasiLabel = akurasi <= 50 ? '✅ Akurat' : akurasi <= 150 ? '⚠️ Cukup' : '❌ Kurang akurat';

      el.innerHTML = `
        <div style="background:#f0fdf4;border:1px solid #a7f3d0;border-radius:10px;padding:12px">
          <div style="font-size:13px;font-weight:700;color:#059669;margin-bottom:6px">✅ Lokasi terdeteksi otomatis</div>
          <div style="font-size:12px;color:#374151;line-height:1.6">
            <div>📍 <strong>${lokasiData.alamat}</strong></div>
            <div style="margin-top:4px;display:flex;gap:12px;flex-wrap:wrap">
              <span style="font-family:monospace;font-size:11px;color:#6b7280">${lat}, ${lng}</span>
              <span style="font-size:11px;color:${akurasiColor};font-weight:700">${akurasiLabel} (±${akurasi}m)</span>
            </div>
          </div>
          <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
            <a href="https://maps.google.com/?q=${lat},${lng}" target="_blank"
               style="font-size:11px;color:#2563eb;text-decoration:none;font-weight:600">
              🗺️ Lihat di Google Maps
            </a>
            <button onclick="ambilLokasi()" style="background:none;border:1px solid #e2e8f0;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;color:#64748b;font-family:inherit;font-weight:600">🔄 Perbarui</button>
          </div>
        </div>
      `;
    },
    (err) => {
      lokasiData = null;
      let msg = 'Gagal ambil lokasi otomatis';
      if (err.code === 1) msg = 'Izin GPS ditolak — aktifkan di pengaturan browser';
      if (err.code === 2) msg = 'Sinyal GPS lemah, coba di area terbuka';
      if (err.code === 3) msg = 'GPS timeout, koneksi mungkin lambat';
      el.innerHTML = `
        <div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:10px;padding:12px">
          <div style="font-size:13px;font-weight:700;color:#dc2626;margin-bottom:6px">❌ ${msg}</div>
          <button onclick="ambilLokasi()" style="background:#dc2626;border:none;border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;color:white;font-family:inherit;font-weight:700">🔄 Coba Lagi</button>
        </div>`;
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

// ============================================================
// SUBMIT ABSEN
// ============================================================
async function submitAbsen(status) {
  if (!photoData) { showToast('Ambil foto selfie dulu!', 'error'); return; }
  if (!lokasiData) { showToast('Ambil lokasi GPS dulu!', 'error'); return; }

  const now = new Date();
  const waktu = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  const tanggal = now.toISOString().split('T')[0];
  const ket = document.getElementById('ket-select').value;

  const btnId = status === 'Masuk' ? 'btn-masuk' : 'btn-pulang';
  document.getElementById(btnId).disabled = true;
  document.getElementById(btnId).textContent = '⏳ Menyimpan...';

  try {
    await fbAdd('absensi', {
      karyawanId: currentUser.karyawanId,
      nama: currentUser.nama,
      jabatan: currentUser.jabatan || '',
      cabangId: currentUser.cabangId,
      cabangNama: currentUser.cabangNama,
      tanggal, waktu, status,
      keterangan: ket,
      foto: photoData,
      lokasi: lokasiData ? {
        lat: lokasiData.lat,
        lng: lokasiData.lng,
        akurasi: lokasiData.akurasi,
        alamat: lokasiData.alamat
      } : null,
      timestamp: now.getTime()
    });

    // Tampil sukses + countdown logout
    const label = status === 'Masuk' ? '✅ Absen Masuk' : '🏠 Absen Pulang';
    document.getElementById('action-buttons').innerHTML = `
      <div style="background:#f0fdf4;border:1px solid #a7f3d0;border-radius:14px;padding:20px;text-align:center">
        <div style="font-size:32px;margin-bottom:8px">${status === 'Masuk' ? '✅' : '🏠'}</div>
        <div style="font-size:16px;font-weight:800;color:#059669;margin-bottom:4px">${label} Berhasil!</div>
        <div style="font-size:13px;color:#374151;margin-bottom:12px">Pukul <strong>${waktu}</strong></div>
        <div style="font-size:12px;color:#6b7280">Otomatis keluar dalam <strong id="countdown">5</strong> detik...</div>
        <button onclick="logout()" style="margin-top:12px;background:#059669;border:none;border-radius:10px;padding:10px 20px;color:white;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;width:100%">
          🚪 Keluar Sekarang
        </button>
      </div>`;

    // Countdown 5 detik lalu auto logout
    let sisa = 5;
    const timer = setInterval(() => {
      sisa--;
      const el = document.getElementById('countdown');
      if (el) el.textContent = sisa;
      if (sisa <= 0) {
        clearInterval(timer);
        logout();
      }
    }, 1000);

    photoData = null;
    lokasiData = null;
  } catch(e) {
    showToast('Gagal menyimpan: ' + e.message, 'error');
    document.getElementById(btnId).disabled = false;
    document.getElementById(btnId).textContent = status === 'Masuk' ? '✅ Absen Masuk' : '🏠 Absen Pulang';
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = 'info') {
  const wrap = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

  waitFirebase().then(() => loadCabangList());
